<!DOCTYPE html>
<html lang="en" data-page="users">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Management</title>

  <!-- Bootstrap (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css" />
</head>

<body class="bg-light">
  <!-- Shared topbar injected -->
  <div id="app-shell"></div>

  <main class="container-fluid">
    <div class="row">
      <aside id="sidebar-slot" class="col-auto p-0"></aside>

      <section class="col p-3 p-md-4">
        <div class="text-uppercase text-secondary small fw-semibold">Organization Management</div>
        <div class="text-secondary small mb-3">Manage team members and user access</div>

        <div class="card shadow-sm">
          <div class="card-header bg-white d-flex align-items-center justify-content-between">
            <h5 class="mb-0 fw-bold">Team Members</h5>
            <button class="btn btn-primary btn-sm" id="inviteBtn">+ Invite User</button>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th style="min-width: 250px;">Name</th>
                  <th style="min-width: 200px;">Email</th>
                  <th style="min-width: 180px;">Role</th>
                  <th style="min-width: 150px;">Status</th>
                  <th style="width: 100px;" class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="users-grid"></tbody>
            </table>
          </div>
          <div id="no-users" class="p-4 text-center text-secondary">No team members yet. Invite your first user to get started.</div>
        </div>
      </section>
    </div>
  </main>

  <!-- Invite User Modal -->
  <div class="modal fade" id="inviteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-bottom-0">
          <h5 class="modal-title fw-bold">Invite Team Member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="invite-form">
            <div class="mb-3">
              <label for="invite-firstName" class="form-label fw-semibold">First Name *</label>
              <input type="text" class="form-control" id="invite-firstName" placeholder="John" required />
            </div>

            <div class="mb-3">
              <label for="invite-lastName" class="form-label fw-semibold">Last Name *</label>
              <input type="text" class="form-control" id="invite-lastName" placeholder="Doe" required />
            </div>

            <div class="mb-3">
              <label for="invite-email" class="form-label fw-semibold">Email *</label>
              <input type="email" class="form-control" id="invite-email" placeholder="john@example.com" required />
            </div>

            <div class="mb-3">
              <label for="invite-role" class="form-label fw-semibold">Role *</label>
              <select class="form-select" id="invite-role" required>
                <option value="">Select a role</option>
                <option value="admin">Admin</option>
                <option value="member">Member</option>
                <option value="viewer">Viewer</option>
              </select>
            </div>

            <div id="invite-error" class="alert alert-danger small mb-3 d-none"></div>
            <div id="invite-success" class="alert alert-success small mb-3 d-none"></div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-grow-1">Send Invitation</button>
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Auth utilities first -->
  <script src="./assets/auth.js"></script>
  
  <!-- Shared layout -->
  <script src="./assets/layout.js"></script>

  <!-- User management logic -->
  <script>
    let currentOrgUser = null;
    const inviteModal = new bootstrap.Modal(document.getElementById('inviteModal'));

    document.addEventListener('DOMContentLoaded', function() {
      // Get current user
      currentOrgUser = getCurrentUser();

      // Redirect if not an organization
      if (!currentOrgUser || currentOrgUser.type !== 'organization') {
        window.location.href = './index.html';
        return;
      }

      renderTeamMembers();

      // Setup invite form
      const inviteForm = document.getElementById('invite-form');
      if (inviteForm) {
        inviteForm.addEventListener('submit', function(e) {
          e.preventDefault();
          handleInviteUser();
        });
      }

      // Setup invite button
      const inviteBtn = document.getElementById('inviteBtn');
      if (inviteBtn) {
        inviteBtn.addEventListener('click', function() {
          document.getElementById('invite-form').reset();
          document.getElementById('invite-error').classList.add('d-none');
          document.getElementById('invite-success').classList.add('d-none');
          inviteModal.show();
        });
      }
    });

    function renderTeamMembers() {
      const grid = document.getElementById('users-grid');
      const noUsers = document.getElementById('no-users');
      const allUsers = JSON.parse(localStorage.getItem('fc_users')) || [];

      // Get users belonging to this organization
      const orgUsers = allUsers.filter(u => 
        u.organizationId === currentOrgUser.id || 
        (u.type === 'individual' && u.organizationId === currentOrgUser.id)
      );

      if (orgUsers.length === 0) {
        grid.innerHTML = '';
        noUsers.style.display = 'block';
        return;
      }

      noUsers.style.display = 'none';
      grid.innerHTML = orgUsers.map(user => `
        <tr>
          <td class="fw-semibold">${user.firstName} ${user.lastName}</td>
          <td>${user.email}</td>
          <td>
            <span class="badge ${user.role === 'admin' ? 'bg-primary' : user.role === 'member' ? 'bg-info' : 'bg-secondary'}">
              ${user.role || 'Member'}
            </span>
          </td>
          <td>
            <span class="badge ${user.isVerified ? 'bg-success' : 'bg-warning'}">
              ${user.isVerified ? 'Active' : 'Pending'}
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger" onclick="removeUser('${user.id}')">Remove</button>
          </td>
        </tr>
      `).join('');
    }

    function handleInviteUser() {
      const firstName = document.getElementById('invite-firstName').value.trim();
      const lastName = document.getElementById('invite-lastName').value.trim();
      const email = document.getElementById('invite-email').value.trim();
      const role = document.getElementById('invite-role').value;
      const errorContainer = document.getElementById('invite-error');
      const successContainer = document.getElementById('invite-success');

      // Reset messages
      errorContainer.classList.add('d-none');
      successContainer.classList.add('d-none');

      // Validation
      if (!firstName || !lastName || !email || !role) {
        showInviteError('All fields are required', errorContainer);
        return;
      }

      if (!isValidEmail(email)) {
        showInviteError('Please enter a valid email address', errorContainer);
        return;
      }

      try {
        const users = JSON.parse(localStorage.getItem('fc_users')) || [];

        // Check if user already exists
        if (users.some(u => u.email === email)) {
          showInviteError('User with this email already exists', errorContainer);
          return;
        }

        // Create new user associated with this organization
        const newUser = {
          firstName: sanitizeInput(firstName),
          lastName: sanitizeInput(lastName),
          email: sanitizeInput(email),
          role: role,
          type: 'team_member',
          organizationId: currentOrgUser.id,
          id: 'user_' + Date.now(),
          createdAt: new Date().toISOString(),
          isVerified: false
        };

        users.push(newUser);
        localStorage.setItem('fc_users', JSON.stringify(users));

        // Show success message
        successContainer.textContent = `Invitation sent to ${email}!`;
        successContainer.classList.remove('d-none');

        // Reset form and re-render
        setTimeout(() => {
          document.getElementById('invite-form').reset();
          renderTeamMembers();
          inviteModal.hide();
        }, 1500);

      } catch (error) {
        showInviteError('An error occurred while inviting the user', errorContainer);
        console.error('Invite error:', error);
      }
    }

    function removeUser(userId) {
      confirmAction('Are you sure you want to remove this user?', () => {
        try {
          const users = JSON.parse(localStorage.getItem('fc_users')) || [];
          const filteredUsers = users.filter(u => u.id !== userId);
          localStorage.setItem('fc_users', JSON.stringify(filteredUsers));
          renderTeamMembers();
        } catch (error) {
          alert('Error removing user');
          console.error('Remove user error:', error);
        }
      }, { title: 'Remove User', confirmText: 'Remove' });
    }

    function showInviteError(message, container) {
      container.textContent = message;
      container.classList.remove('d-none');
    }
  </script>
</body>
</html>
