<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - FC Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --fc-primary: #1a365d;
      --fc-accent: #f59e0b;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .signin-card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }
    .signin-header {
      background: var(--fc-primary);
      padding: 2rem;
      text-align: center;
    }
    .signin-header h1 {
      color: #fff;
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
    }
    .signin-header .accent {
      color: var(--fc-accent);
    }
    .signin-header p {
      color: rgba(255,255,255,0.7);
      margin: 0.5rem 0 0;
      font-size: 0.875rem;
    }
    .signin-body {
      padding: 2rem;
    }
    .form-label {
      font-weight: 500;
      font-size: 0.875rem;
    }
    .btn-signin {
      background: var(--fc-primary);
      border-color: var(--fc-primary);
      padding: 0.75rem 1.5rem;
    }
    .btn-signin:hover {
      background: #0f2440;
      border-color: #0f2440;
    }
    .demo-accounts {
      background: #f8fafc;
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1.5rem;
    }
    .demo-accounts h6 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 0.75rem;
    }
    .demo-btn {
      font-size: 0.8rem;
      padding: 0.375rem 0.75rem;
      margin: 0.25rem;
    }
    .role-badge {
      font-size: 0.65rem;
      vertical-align: middle;
      margin-left: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="signin-card">
    <div class="signin-header">
      <h1><span class="accent">FC</span> Admin Portal</h1>
      <p>Subscription Management System</p>
    </div>
    <div class="signin-body">
      <form id="signinForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" id="email" class="form-control" placeholder="admin@fieldclimate.com" required>
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            <button type="button" class="btn btn-outline-secondary" id="togglePassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>
        <div id="errorAlert" class="alert alert-danger d-none small py-2" role="alert">
          <i class="bi bi-exclamation-circle me-1"></i><span id="errorMessage"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-signin w-100">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <!-- Demo Accounts for Testing -->
      <div class="demo-accounts">
        <h6><i class="bi bi-people me-1"></i>Demo Accounts (Click to fill)</h6>
        <div class="d-flex flex-wrap justify-content-center">
          <button type="button" class="btn btn-outline-primary demo-btn" data-email="global.admin@fc.com" data-pass="admin123">
            Global Admin <span class="badge bg-primary role-badge">Full</span>
          </button>
          <button type="button" class="btn btn-outline-secondary demo-btn" data-email="global.analyst@fc.com" data-pass="analyst123">
            Global Analyst <span class="badge bg-secondary role-badge">Read</span>
          </button>
          <button type="button" class="btn btn-outline-success demo-btn" data-email="germany.manager@fc.com" data-pass="manager123">
            DE Manager <span class="badge bg-success role-badge">Region</span>
          </button>
          <button type="button" class="btn btn-outline-info demo-btn" data-email="france.analyst@fc.com" data-pass="analyst123">
            FR Analyst <span class="badge bg-info role-badge">Region</span>
          </button>
        </div>
      </div>

      <div class="text-center mt-4">
        <a href="../index.html" class="text-secondary small text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i>Back to Platform
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/admin-data.js"></script>
  <script>
    // Demo users database
    const DEMO_USERS = [
      { email: 'global.admin@fc.com', password: 'admin123', role: 'GlobalAdmin', name: 'Global Administrator', countries: [] },
      { email: 'global.analyst@fc.com', password: 'analyst123', role: 'GlobalAnalyst', name: 'Global Analyst', countries: [] },
      { email: 'germany.manager@fc.com', password: 'manager123', role: 'RegionalManager', name: 'Germany Manager', countries: ['Germany', 'Austria', 'Switzerland'] },
      { email: 'france.manager@fc.com', password: 'manager123', role: 'RegionalManager', name: 'France Manager', countries: ['France', 'Belgium'] },
      { email: 'italy.manager@fc.com', password: 'manager123', role: 'RegionalManager', name: 'Italy Manager', countries: ['Italy'] },
      { email: 'spain.manager@fc.com', password: 'manager123', role: 'RegionalManager', name: 'Spain Manager', countries: ['Spain', 'Portugal'] },
      { email: 'germany.analyst@fc.com', password: 'analyst123', role: 'RegionalAnalyst', name: 'Germany Analyst', countries: ['Germany', 'Austria', 'Switzerland'] },
      { email: 'france.analyst@fc.com', password: 'analyst123', role: 'RegionalAnalyst', name: 'France Analyst', countries: ['France', 'Belgium'] },
    ];

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const icon = this.querySelector('i');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });

    // Demo account buttons
    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('email').value = btn.dataset.email;
        document.getElementById('password').value = btn.dataset.pass;
      });
    });

    // Sign in form
    document.getElementById('signinForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      
      // Find user
      const user = DEMO_USERS.find(u => u.email.toLowerCase() === email && u.password === password);
      
      if (!user) {
        errorAlert.classList.remove('d-none');
        errorMessage.textContent = 'Invalid email or password. Try a demo account.';
        return;
      }
      
      // Store session
      const session = {
        email: user.email,
        name: user.name,
        role: user.role,
        countries: user.countries,
        loginTime: new Date().toISOString()
      };
      sessionStorage.setItem('fc_admin_session', JSON.stringify(session));
      
      // Redirect to dashboard
      window.location.href = 'index.html';
    });

    // Check if already logged in
    const existingSession = sessionStorage.getItem('fc_admin_session');
    if (existingSession) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
