<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - FC User Access Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --uam-primary: #6f42c1;
      --uam-primary-light: #8b5cf6;
    }
    
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .signin-container {
      width: 100%;
      max-width: 420px;
    }
    
    .signin-header {
      text-align: center;
      margin-bottom: 2rem;
      color: #fff;
    }
    
    .signin-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    
    .signin-header .accent {
      color: #fbbf24;
    }
    
    .signin-header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }
    
    .signin-card {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    
    .form-label {
      font-weight: 500;
      font-size: 0.875rem;
      color: #374151;
    }
    
    .form-control {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid #d1d5db;
    }
    
    .form-control:focus {
      border-color: var(--uam-primary);
      box-shadow: 0 0 0 3px rgba(111, 66, 193, 0.1);
    }
    
    .btn-signin {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, var(--uam-primary) 0%, var(--uam-primary-light) 100%);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      color: #fff;
      transition: all 0.2s;
    }
    
    .btn-signin:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(111, 66, 193, 0.4);
      color: #fff;
    }
    
    .demo-section {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }
    
    .demo-section h6 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }
    
    .demo-btn {
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.875rem;
      border-color: #e5e7eb;
    }
    
    .demo-btn:hover {
      background: #f9fafb;
      border-color: var(--uam-primary);
    }
    
    .role-badge {
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
    }
    
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      font-size: 0.875rem;
    }
    
    .back-link:hover {
      color: #fff;
    }
    
    .feature-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, rgba(111, 66, 193, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--uam-primary);
      margin-right: 0.75rem;
    }
    
    .alert {
      border-radius: 8px;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="signin-container">
    <div class="signin-header">
      <h1><span class="accent">FC</span> User Access Management</h1>
      <p><i class="bi bi-shield-lock me-1"></i>Control platform access privileges</p>
    </div>
    
    <div class="signin-card">
      <form id="signinForm">
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="admin@fieldclimate.com" required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        
        <div id="errorAlert" class="alert alert-danger d-none mb-3">
          <i class="bi bi-exclamation-circle me-2"></i>
          <span id="errorMessage">Invalid credentials</span>
        </div>
        
        <button type="submit" class="btn btn-signin">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>
      
      <div class="demo-section">
        <h6><i class="bi bi-lightning me-1"></i>Demo Accounts</h6>
        <button type="button" class="btn btn-outline-secondary demo-btn" data-email="superadmin@fc.com" data-pass="admin123">
          <span class="d-flex align-items-center">
            <span class="feature-icon"><i class="bi bi-shield-fill-check"></i></span>
            Super Admin
          </span>
          <span class="badge bg-danger role-badge">Full Control</span>
        </button>
        <button type="button" class="btn btn-outline-secondary demo-btn" data-email="it.admin@fc.com" data-pass="admin123">
          <span class="d-flex align-items-center">
            <span class="feature-icon"><i class="bi bi-person-gear"></i></span>
            IT Administrator
          </span>
          <span class="badge bg-primary role-badge">IT Ops</span>
        </button>
      </div>
    </div>
    
    <a href="../demo.html" class="back-link">
      <i class="bi bi-arrow-left me-1"></i>Back to Demo Quicklinks
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/uam-data.js"></script>
  <script>
    // Check if already logged in
    if (UAMData.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    // Form submission
    document.getElementById('signinForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const result = UAMData.login(email, password);
      
      if (result.success) {
        window.location.href = 'index.html';
      } else {
        document.getElementById('errorAlert').classList.remove('d-none');
        document.getElementById('errorMessage').textContent = result.message;
      }
    });

    // Demo account buttons
    document.querySelectorAll('.demo-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('email').value = btn.dataset.email;
        document.getElementById('password').value = btn.dataset.pass;
        document.getElementById('errorAlert').classList.add('d-none');
      });
    });

    // Hide error on input
    document.querySelectorAll('#email, #password').forEach(input => {
      input.addEventListener('input', () => {
        document.getElementById('errorAlert').classList.add('d-none');
      });
    });
  </script>
</body>
</html>
